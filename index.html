
<section class="section workspace" id="workspace">
  <div class="ai-layout">

    <aside class="ai-sidebar">
      <a href="#" class="logo"><span>∞</span> NEXAR AI</a>

      <button id="new-chat" class="sidebar-new-chat">
        + New Chat
      </button>

      <h3>RECENT CHATS</h3>
      <div id="history-list"></div>

      <div class="sidebar-bottom">
        <div class="sidebar-profile">
          <div class="profile-icon">N</div>
          <div>
            <strong>NEXAR AI</strong>
            <small>AI Workspace</small>
          </div>
        </div>
      </div>
    </aside>

    <div class="ai-main">
      <div class="ai-topbar">
        <span>∞ NEXAR AI</span>
        <span class="online-status">● ONLINE</span>
      </div>

      <div class="chat-box">
        <div class="chat-heading">
          <span class="status-dot"></span>
          NEXAR AI
          <span class="demo-label">AI ASSISTANT</span>
        </div>

        <div id="chat-messages" class="chat-messages">
          <div class="message assistant">
            Hello! Welcome to NEXAR AI. What would you like to explore?
          </div>
        </div>

        <form id="chat-form" class="chat-form">
          <input id="chat-input" type="text"
            placeholder="Message NEXAR AI..."
            autocomplete="off">
          <button type="submit">Send ↗</button>
        </form>

        <p class="demo-note">
          NEXAR AI can make mistakes. Check important information.
        </p>
      </div>
    </div>

  </div>
</section>
